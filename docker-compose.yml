services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-requestflow}
      POSTGRES_USER: ${POSTGRES_USER:-requestflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-requestflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-requestflow} -d ${POSTGRES_DB:-requestflow}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-requestflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-requestflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-requestflow}
    ports:
      - "8080:8080"

volumes:
  pgdata:
